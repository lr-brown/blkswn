<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pure JS Draggable Globe</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #0b0f19;
      overflow: hidden;
    }
    canvas {
      cursor: grab;
      touch-action: none;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>

<canvas id="globe" width="500" height="500"></canvas>

<script>
  const canvas = document.getElementById('globe');
  const ctx = canvas.getContext('2d');
  const width = canvas.width;
  const height = canvas.height;
  const cx = width / 2;
  const cy = height / 2;
  const radius = 200;

  // Rotation angles in radians
  let rotX = 0.3; // Latitude tilt
  let rotY = 0.0; // Longitude spin

  // Dragging & inertia state
  let isDragging = false;
  let lastX = 0;
  let lastY = 0;
  let velX = 0;
  let velY = 0.004; // Initial gentle auto-rotation

  // Project 3D spherical coordinates (lat, lon) to 2D canvas (x, y, z)
  function project(lat, lon) {
    // Convert spherical to 3D Cartesian
    let x = radius * Math.cos(lat) * Math.sin(lon);
    let y = radius * Math.sin(lat);
    let z = radius * Math.cos(lat) * Math.cos(lon);

    // Rotate around Y-axis (longitude)
    const cosY = Math.cos(rotY);
    const sinY = Math.sin(rotY);
    const x1 = x * cosY - z * sinY;
    const z1 = z * cosY + x * sinY;

    // Rotate around X-axis (latitude tilt)
    const cosX = Math.cos(rotX);
    const sinX = Math.sin(rotX);
    const y2 = y * cosX - z1 * sinX;
    const z2 = z1 * cosX + y * sinX;

    return {
      x: cx + x1,
      y: cy - y2,
      z: z2 // Positive z means facing the viewer
    };
  }

  function drawGlobe() {
    ctx.clearRect(0, 0, width, height);

    // 1. Draw ocean base with 3D radial shading
    const grad = ctx.createRadialGradient(
      cx - radius * 0.3, cy - radius * 0.3, radius * 0.1,
      cx, cy, radius
    );
    grad.addColorStop(0, '#1e3a8a');
    grad.addColorStop(1, '#091124');

    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 2. Draw latitude and longitude lines
    ctx.strokeStyle = 'rgba(96, 165, 250, 0.35)';
    ctx.lineWidth = 1;

    // Parallels (Latitude)
    for (let lat = -75; lat <= 75; lat += 15) {
      drawLine(lat, -180, lat, 180, true);
    }

    // Meridians (Longitude)
    for (let lon = -180; lon < 180; lon += 15) {
      drawLine(-90, lon, 90, lon, false);
    }
  }

  function drawLine(lat1, lon1, lat2, lon2, isLat) {
    ctx.beginPath();
    let penDown = false;
    const steps = 60;

    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const lat = ((isLat ? lat1 : lat1 + (lat2 - lat1) * t) * Math.PI) / 180;
      const lon = ((!isLat ? lon1 : lon1 + (lon2 - lon1) * t) * Math.PI) / 180;
      const p = project(lat, lon);

      // Only draw segments on the front hemisphere (z >= 0)
      if (p.z >= 0) {
        if (!penDown) {
          ctx.moveTo(p.x, p.y);
          penDown = true;
        } else {
          ctx.lineTo(p.x, p.y);
        }
      } else {
        penDown = false;
      }
    }
    ctx.stroke();
  }

  function animate() {

    drawGlobe();
    requestAnimationFrame(animate);
  }

  // Pointer Events (handles both Mouse and Touch seamlessly)
  canvas.addEventListener('pointerdown', (e) => {
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    velX = 0;
    velY = 0;
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;

    // Sensitivity factor
    velY = dx * -0.005;
    velX = dy * 0.005;

    rotY += velY;
    rotX += velX;
    rotX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotX));

    lastX = e.clientX;
    lastY = e.clientY;
  });

  canvas.addEventListener('pointerup', (e) => {
    isDragging = false;
    canvas.releasePointerCapture(e.pointerId);
  });

  // Start animation loop
  animate();
</script>
</body>
</html>
